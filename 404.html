<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>404 | Yolanda Services</title>

  <link rel="stylesheet" href="assets/css/style.css">

  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: #050505;
      color: white;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .error-container {
      text-align: center;
      animation: fadeIn 1s ease;
    }

    .logo {
      width: 120px;
      margin-bottom: 20px;
      animation: float 3s infinite ease-in-out;
    }

    h1 {
      font-size: 120px;
      margin: 0;
      color: #ff1493;
      text-shadow: 0 0 20px #ff1493;
    }

    h2 {
      font-size: 30px;
      margin: 10px 0;
    }

    p {
      color: #ccc;
      font-size: 17px;
      max-width: 500px;
      margin: auto;
    }

    .home-btn {
      display: inline-block;
      margin-top: 30px;
      padding: 14px 35px;
      background: #ff1493;
      color: white;
      text-decoration: none;
      border-radius: 30px;
      font-weight: bold;
      transition: .3s;
      box-shadow: 0 0 20px #ff1493;
    }

    .home-btn:hover {
      background: white;
      color: #ff1493;
      transform: translateY(-5px);
    }

    @keyframes float {
      50% {
        transform: translateY(-15px);
      }
    }

    @keyframes fadeIn {
      from {
        opacity:0;
        transform: translateY(30px);
      }
      to {
        opacity:1;
        transform: translateY(0);
      }
    }

  </style>

</head>

<body>

<div class="error-container">

  <img src="assets/images/logo.png" class="logo" alt="Yolanda Services Logo">

  <h1>404</h1>

  <h2>Page Not Found</h2>

  <p>
    Sorry, the page you are looking for does not exist or has been moved.
    Return to Yolanda Services and continue exploring our services.
  </p>

  <a href="index.html" class="home-btn">
    Back To Home
  </a>

</div>

</body>
</html>
